# Hard, deterministic rules (stage 2) — applied BEFORE the LLM, cost 0 tokens.
# TODO (Nik): adjust terms. Matching is case-insensitive with word boundaries.

blacklist: []          # empty list (not null!) => no hard-blocked terms
  # Intentionally empty. Nik's no-gos (Java, PHP, WordPress, Django, SAP) are all
  # CONTEXT-DEPENDENT: a "migrate away from WordPress/PHP" project, a frontend-only
  # role with an X backend, or an integration from a modern stack are all desirable.
  # A 0-token literal match can't tell those apart, so matching is left to the LLM
  # (the no-gos live in profile.md). Add a term here only for a TRULY unconditional
  # exclusion that no context could rescue.

must_have: []         # optional: terms of which at least one must appear

languages: [de, en]   # listing languages that are accepted

# Context-dependent no-go technologies from profile.md ("No-gos" → Technologies).
# These are NOT matched against the listing text — a frontend role against a Java
# backend, or a migration away from PHP, stays welcome. They are enforced on the
# LLM's own answer: when the model reports one of these under
# `missing_requirements` (i.e. the listing requires the candidate to bring it and
# the profile does not cover it), the verdict is forced to no_match, whatever the
# score. Matching is case-insensitive with word boundaries, so `java` never fires
# on "JavaScript" and `spring` covers "Spring Boot".
nogo_technologies:
  - java
  - spring          # also matches "Spring Boot", "Spring Framework"
  - jakarta ee
  - java ee
  - jsf
  - php
  - laravel
  - symfony
  - wordpress
  - typo3
  - django
  - sap
  - abap
