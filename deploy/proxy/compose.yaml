# The proxy stack: the only thing on the VPS that publishes ports.
#
# It owns the shared `edge` network that project-pilot's `mcp` service joins, so
# bring it up once and every later project-pilot deploy is reachable without
# touching this stack again.
#
#   scp -r deploy/proxy <user>@<host>:/opt/stacks/proxy
#   cd /opt/stacks/proxy && cp .env.example .env && nano .env   # ACME_EMAIL
#   docker network create edge          # skipped if project-pilot created it already
#   docker compose up -d
services:
  caddy:
    image: caddy:2-alpine
    # 80 is not optional: Let's Encrypt validates over it before 443 has a cert.
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and keys live here — losing this volume means re-issuing them,
      # which Let's Encrypt rate-limits.
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - edge

volumes:
  caddy_data:
  caddy_config:

networks:
  edge:
    external: true
