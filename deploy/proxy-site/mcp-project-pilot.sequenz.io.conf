# project-pilot's MCP server, behind the existing nginx-auto-ssl proxy
# (github.com/nikita-petrich/reverse-proxy).
#
# Why this is a file rather than another `SITES` entry: the proxy image renders
# every SITES entry from one generic template that leaves nginx's defaults in
# place — `proxy_buffering on`, `proxy_read_timeout 60s`, gzip on. MCP talks
# Streamable HTTP over Server-Sent Events, so those defaults turn a working
# server into one that stalls and drops its stream once a minute. Everything
# below is that template plus the four lines that make streaming work.
#
# Wiring (see this folder's README):
#   1. Do NOT list mcp-project-pilot.sequenz.io in SITES — the entrypoint would try to write
#      this same path and fail on the read-only mount.
#   2. Mount this single file (not the directory) into /etc/nginx/conf.d/.
#   3. ALLOWED_DOMAINS must match mcp-project-pilot.sequenz.io, or the proxy serves its
#      self-signed fallback certificate instead of ordering a real one.

server {
  listen 443 ssl http2;
  server_name mcp-project-pilot.sequenz.io;

  include resty-server-https.conf;

  location / {
    # Docker's embedded DNS, resolved per request rather than once at startup:
    # every project-pilot deploy recreates the mcp container with a new IP, and
    # a statically resolved upstream would answer 502 until the proxy restarts.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $mcp_upstream project-pilot-mcp:8765;

    proxy_pass http://$mcp_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The four that matter for MCP: hand every SSE chunk straight through,
    # never compress the stream, and let an idle notification stream live.
    proxy_buffering off;
    gzip off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
