# Golden-set eval against the live LLM. Costs tokens, so it is its own workflow:
# manual runs plus every change to what shapes the judgment (prompts, skills,
# profile, evaluation code, the golden set itself). The job checks for the key
# at runtime and skips gracefully when it is absent — GitHub cannot reference
# secrets in job-level `if`, and a fork's pull request gets no environment secrets
# at all.
#
# It judges with whatever LLM_PROVIDER/LLM_MODEL the prod environment selects, so a
# provider switch is proved here before it reaches the worker.
name: Eval

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/project_pilot/evaluation/**"
      - "profile/**"
      - ".claude/skills/**"
      - "tests/eval/**"

permissions:
  contents: read

jobs:
  golden-set:
    runs-on: ubuntu-latest
    # Reads the same secret store as the deploy, so LLM_PROVIDER/LLM_MODEL and the
    # API key live in one place and the eval necessarily judges with the very
    # configuration the worker runs. Without it this job sees only repository-level
    # secrets, and a missing copy there makes it skip green without judging a case.
    environment: prod
    # All four are environment *secrets* (as the deploy renders them), not variables:
    # read from the wrong store they are empty, and the job skips green without
    # judging a single case.
    env:
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      LLM_EFFORT: ${{ secrets.LLM_EFFORT }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.17"
          python-version: "3.13"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Golden-set eval
        run: |
          # Only the selected provider's key matters, so check that one.
          case "${LLM_PROVIDER:-openai}" in
            anthropic) key="$ANTHROPIC_API_KEY" ;;
            *)         key="$OPENAI_API_KEY" ;;
          esac
          if [ -z "$key" ] || [ -z "$LLM_MODEL" ]; then
            echo "LLM key/LLM_MODEL not configured — skipping eval."
            exit 0
          fi
          uv run pytest -m eval --no-cov
