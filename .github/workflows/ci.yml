# Quality gate for everything that is not main. Pushes to main run the same gate
# inside deploy.yml, so it is excluded here rather than run twice per commit.
name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

# Least privilege: the gate only checks out and tests, so a compromised step
# inherits read-only access to the repo and nothing else.
permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/quality-gate.yml
