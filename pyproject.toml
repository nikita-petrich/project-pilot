[project]
name = "project-pilot"
version = "0.1.0"
description = "Personal freelancermap.de listing pilot: fetch, evaluate against a profile, and alert real matches via Slack."
readme = "README.md"
authors = [{ name = "Nik Petrich" }]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "aiosmtplib>=5.1.2",
    "alembic>=1.18.5",
    "apscheduler>=3.11.3",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "fastmcp>=3.4.7",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "openai>=2.46.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.14.2",
    "pyyaml>=6.0.3",
    "slack-sdk>=3.43.0",
    "sqlalchemy>=2.0.51",
    "tenacity>=9.1.4",
    "typer>=0.27.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
project-pilot = "project_pilot.cli:app"

[project.optional-dependencies]
render = [
    "playwright>=1.49",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.15.22",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TC",   # flake8-type-checking
    "ASYNC",# flake8-async
    "DTZ",  # flake8-datetimez (enforce tz-aware datetimes)
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific rules
    "LOG",  # flake8-logging
    "G",    # flake8-logging-format
]
ignore = [
    "B008",   # function calls in argument defaults (typer uses this pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DTZ"]
"alembic/*" = ["I", "N", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["project_pilot"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests", "deploy"]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["apscheduler.*", "bs4.*", "playwright.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# "not eval" keeps the quality gate offline and token-free; run the golden-set
# eval explicitly with `uv run pytest -m eval` (needs OPENAI_API_KEY + LLM_MODEL).
addopts = "--cov=project_pilot --cov-report=term-missing -m 'not eval'"
markers = ["eval: golden-set evals against the live LLM (cost tokens; excluded by default)"]

[tool.coverage.run]
source = ["src/project_pilot"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
