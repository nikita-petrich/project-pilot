# Production compose for the VPS, shipped by the deploy workflow to
# /opt/stack/project-pilot/compose.yaml. The exact image tag is pinned next to it in
# the generated compose.override.yaml.
#
# Differs from compose.yaml (build on this host) in two ways:
#   - the image comes from GHCR instead of a local build, so the server needs no source;
#   - profile/ and cv/ are mounted from the server, because profile.md and the CV PDFs
#     are gitignored and therefore cannot be baked into an image built in CI.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pilot}
      POSTGRES_DB: project_pilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilot -d project_pilot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    # Overridden per deploy with an immutable sha-* tag; :latest is only the fallback
    # for a manual 'docker compose up -d' without the override file.
    image: ghcr.io/nikita-petrich/project-pilot:latest
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pilot:${POSTGRES_PASSWORD:-pilot}@postgres:5432/project_pilot
    volumes:
      # profile.md is personal and constraints.yaml is tuned per deploy, so both are
      # read from the server: editing them needs a restart, not a rebuild.
      - ./profile:/app/profile:ro
      # CV PDFs for application e-mails; point CV_DE_PATH / CV_EN_PATH at /app/cv/...
      - ./cv:/app/cv:ro
    healthcheck:
      test: ["CMD", "project-pilot", "healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  pgdata:
