# Development/test infrastructure only. The production compose is built in Feature 11.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pilot
      POSTGRES_PASSWORD: pilot
      POSTGRES_DB: project_pilot
    ports:
      # Bound to localhost so the dev database is reachable from this machine only,
      # not from anything else on the LAN (Docker otherwise punches through the host
      # firewall to publish on all interfaces).
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
